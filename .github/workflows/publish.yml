name: Verify official rates and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pypdf==6.10.0
      - run: npm test
      - run: python scripts/collect_official_pf.py
      - name: Record official source verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/official-fixed.json; then
            git add data/official-fixed.json
            git commit -m "Refresh official fixed-deposit source verification"
            git push
          fi
      - name: Prepare public files and software version
        run: python scripts/prepare_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Report source health
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('data/official-fixed.json')
          if not path.exists():
              raise SystemExit('Official source result missing')
          data = json.loads(path.read_text())
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Official fixed-deposit verification\n')
              summary.write('Checked: ' + data['generatedAt'] + '\n\n')
              summary.write('Verified banks: ' + str(len(data['products'])) + '\n')
              for product in data['products']:
                  summary.write('- ' + product['name'] + ': effective since ' + product['effectiveFrom'] + '\n')
          for error in data['errors']:
              print('::warning::' + error['name'] + ': source verification failed; excluded from current comparison')
          if not data['products']:
              raise SystemExit('No official bank source verified. App published with unavailable state.')
          PY
